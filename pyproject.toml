[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouthmixer"
version = "0.3.0"
description = "Turns hums, whistles, beatbox and singing into finished, original game music (prototype)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "pretty_midi>=0.2.10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "tinysoundfont>=0.3.7",  # instruments (GeneralUser GS in assets/soundfonts)
  "pedalboard>=0.9",       # effects
  "pyloudnorm>=0.1.1",     # loudness
  # Vocals and lyrics (docs/VOCALS.md)
  "pyworld>=0.3.4",        # WORLD vocoder: voice characters (tone, grit, whisper, stacks); tuning uses PSOLA
  "setuptools<81",         # pyworld imports pkg_resources, which setuptools 81 removes
  "noisereduce>=3.0",      # spectral noise reduction from the take's own room noise
  "pronouncing>=0.2",      # CMU dictionary: syllables and stress for fitting words to notes
  "anthropic>=1.0",        # lyric writing with Claude (only when you add an API key)
]

[project.optional-dependencies]
# The parts that need real hardware or a desktop: mic capture, tray icon, global hotkey.
windows = [
  "sounddevice>=0.4.6",
  "pystray>=0.19",
  "pillow>=10",
  "pynput>=1.7",
]
# Reference-song analysis with stems (docs/REFERENCE_ANALYSIS.md). Install PyTorch CPU first:
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
analysis = ["demucs>=4.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mouthmixer = "mouthmixer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouthmixer = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
